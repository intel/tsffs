version: 2
updates:
  - package-ecosystem: docker
    directory: /.github/builder
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # The builder deliberately uses an old Fedora (old glibc) for portable binaries
    ignore:
      - dependency-name: fedora

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    # init, analyze and upload-sarif must run the same version, so bump them together
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /examples/manual-example
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /examples/tutorials/edk2-simics-platform
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /examples/tutorials/edk2-uefi
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /examples/tutorials/risc-v-kernel
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /tests/rsrc/riscv-64
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /tests/rsrc/x86_64-breakpoint-uefi-edk2
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /tests/rsrc/x86_64-timeout-uefi-edk2
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /tests/rsrc/x86_64-uefi-edk2
    schedule:
      interval: daily
    cooldown:
      default-days: 7
